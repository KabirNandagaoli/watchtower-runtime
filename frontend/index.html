<body><aside><div class="brand"><span>◈</span> WATCHTOWER</div><nav><button class="nav active" data-page="overview">Overview</button><button class="nav" data-page="agents">Agents</button><button class="nav" data-page="policies">Policies</button><button class="nav" data-page="logs">Action Log</button><button class="nav" data-page="lab">Security Lab</button></nav><div class="side-note">MVP PROTOTYPE<br><small>Simulation is not enforcement.</small></div></aside>
